services:
  - type: web
    name: svitlo-backend-pilot
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix server/schedule-relay && npm run build --prefix server/schedule-relay
    startCommand: npm start --prefix server/schedule-relay
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: STORAGE_API_URL
        value: https://svitlo-notifications-storage.svitlonorify.workers.dev
      - key: STORAGE_API_TOKEN
        sync: false
      - key: TICK_RUN_TOKEN
        sync: false
