appId: ${APP_ID}
---
- launchApp:
    clearState: false
    permissions:
      notifications: unset
- openLink: ${DEV_URL}
- extendedWaitUntil:
    visible: 'Обрати чергу|Сповіщення'
    timeout: 120000
- openLink: ${RESET_URL}
- extendedWaitUntil:
    visible: Обрати чергу
    timeout: 30000
- tapOn: Обрати чергу
- extendedWaitUntil:
    visible: Черга 1.1
    timeout: 30000
- tapOn: Черга 1.1
- tapOn:
    text: Пізніше
    optional: true
- tapOn: Сповіщення
- extendedWaitUntil:
    visible: 'Сповіщень поки немає.*'
    timeout: 30000
- takeScreenshot: notifications-empty
